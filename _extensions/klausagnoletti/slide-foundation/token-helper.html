<script>
/* Slide Foundation: shared token-reading helper. JS consumers (charts, Lottie
   recolour, motion libs) cannot read var(--token) internally, so they call this
   to resolve a role token to a usable value/colour. One helper for all of them. */
window.SlideFoundation = window.SlideFoundation || (function () {
  function token(name, el) {
    return getComputedStyle(el || document.documentElement)
      .getPropertyValue(name).trim();
  }
  // resolve a token (may itself be a var or hex) to a concrete rgb(a) string
  function tokenColor(name, el) {
    var probe = document.createElement('span');
    probe.style.color = token(name, el) || '#000';
    probe.style.display = 'none';
    document.body.appendChild(probe);
    var c = getComputedStyle(probe).color;
    probe.remove();
    return c;
  }
  // duration token (e.g. "0.4s") -> milliseconds for JS animation libs
  function tokenMs(name, el) {
    var v = token(name, el);
    if (!v) return 0;
    return v.indexOf('ms') > -1 ? parseFloat(v) : parseFloat(v) * 1000;
  }
  // WCAG relative luminance 0..1 of any CSS colour (channels linearised from sRGB),
  // or null when it cannot be parsed. Normalised through a canvas so oklch()/color()
  // token values parse too. One copy: poll.js (QR panel) and speaker-view.js (dark flip).
  var ctx = document.createElement('canvas').getContext('2d');
  function lin(v) { v = v / 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }
  function luminance(c) {
    if (!c || !ctx) return null;
    ctx.fillStyle = '#000'; ctx.fillStyle = c;
    var m = /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})/i.exec(ctx.fillStyle), r, g, b;
    if (m) { r = parseInt(m[1], 16); g = parseInt(m[2], 16); b = parseInt(m[3], 16); }
    else { m = /rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(ctx.fillStyle); if (!m) return null; r = +m[1]; g = +m[2]; b = +m[3]; }
    return 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
  }
  // true when the skin is light (surface brighter than ink); false when dark or unreadable
  function isLightSkin(el) {
    var s = luminance(tokenColor('--surface', el)), i = luminance(tokenColor('--ink', el));
    return s !== null && i !== null && s > i;
  }
  return { token: token, tokenColor: tokenColor, tokenMs: tokenMs, luminance: luminance, isLightSkin: isLightSkin };
})();
</script>
