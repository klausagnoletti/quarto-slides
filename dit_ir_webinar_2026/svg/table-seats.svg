<!-- Static base: table ellipse + the six canonical M&M roles as ghost seats with labels.
     The 6 highlight dots are separate reveal.js .fragment elements positioned in the qmd
     (CSS circles, absolutely positioned by percentage in local-style.html) so each seat
     lights up on its own fragment step. Order = M&M role order.
     Seat centers (viewBox 440x240): Detective (220,45) Protector (311,85) Tracker (311,155)
     Communicator (220,195) Crisis Manager (129,155) Threat Hunter (129,85). -->
<svg viewBox="0 0 440 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Table seen from above with the six Malware and Monsters roles">
  <ellipse cx="220" cy="120" rx="90" ry="55" fill="none" stroke="#F8F8FA" stroke-width="3" opacity="0.6" />
  <g fill="none" stroke="#CCCCCC" stroke-width="2" opacity="0.25">
    <circle cx="220" cy="45" r="16" />
    <circle cx="311" cy="85" r="16" />
    <circle cx="311" cy="155" r="16" />
    <circle cx="220" cy="195" r="16" />
    <circle cx="129" cy="155" r="16" />
    <circle cx="129" cy="85" r="16" />
  </g>
  <g fill="#CCCCCC" font-family="'Source Sans 3', sans-serif" font-size="14" opacity="0.85">
    <text x="220" y="20" text-anchor="middle">Detective</text>
    <text x="333" y="90" text-anchor="start">Protector</text>
    <text x="333" y="160" text-anchor="start">Tracker</text>
    <text x="220" y="228" text-anchor="middle">Communicator</text>
    <text x="107" y="160" text-anchor="end">Crisis Manager</text>
    <text x="107" y="90" text-anchor="end">Threat Hunter</text>
  </g>
</svg>
