<!-- Static base: table ellipse + the six canonical M&M roles as ghost seats with labels.
     The 6 highlight dots are separate reveal.js .fragment elements positioned in the qmd
     (plain CSS circles, absolutely positioned over these coordinates in local-style.html)
     so each seat lights up on its own fragment step. Order = M&M role order.
     Seat centers (viewBox 360x240): Detective (180,45) Protector (271,85) Tracker (271,155)
     Communicator (180,195) Crisis Manager (89,155) Threat Hunter (89,85). -->
<svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Table seen from above with the six Malware and Monsters roles">
  <ellipse cx="180" cy="120" rx="90" ry="55" fill="none" stroke="#F8F8FA" stroke-width="3" opacity="0.6" />
  <g fill="none" stroke="#CCCCCC" stroke-width="2" opacity="0.25">
    <circle cx="180" cy="45" r="16" />
    <circle cx="271" cy="85" r="16" />
    <circle cx="271" cy="155" r="16" />
    <circle cx="180" cy="195" r="16" />
    <circle cx="89" cy="155" r="16" />
    <circle cx="89" cy="85" r="16" />
  </g>
  <g fill="#CCCCCC" font-family="'Source Sans 3', sans-serif" font-size="13" opacity="0.85">
    <text x="180" y="22" text-anchor="middle">Detective</text>
    <text x="293" y="89" text-anchor="start">Protector</text>
    <text x="293" y="159" text-anchor="start">Tracker</text>
    <text x="180" y="226" text-anchor="middle">Communicator</text>
    <text x="67" y="159" text-anchor="end">Crisis Manager</text>
    <text x="67" y="89" text-anchor="end">Threat Hunter</text>
  </g>
</svg>
