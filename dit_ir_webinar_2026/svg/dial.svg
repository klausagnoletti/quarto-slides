<svg viewBox="0 0 240 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Klikrate-dial, drejet fra 3% til 30%">
  <defs>
    <style>
      .dial-arc { fill: none; stroke: #F8F8FA; stroke-width: 10; stroke-linecap: round; opacity: 0.25; }
      .dial-needle { transform-origin: 120px 130px; }
      .dial-readout { font-family: "Source Sans 3", sans-serif; font-size: 34px; fill: #FFC800; font-weight: 700; }
      .dial-label { font-family: "Source Sans 3", sans-serif; font-size: 13px; fill: #CCCCCC; letter-spacing: 0.04em; }
    </style>
  </defs>
  <path class="dial-arc" d="M 20 130 A 100 100 0 0 1 220 130" />
  <g class="dial-needle">
    <line x1="120" y1="130" x2="120" y2="45" stroke="#FFC800" stroke-width="6" stroke-linecap="round">
      <animateTransform
        attributeName="transform"
        type="rotate"
        values="-70 120 130; 34 120 130"
        keyTimes="0; 1"
        dur="1.4s"
        begin="indefinite"
        fill="freeze"
        id="dialTurn" />
    </line>
  </g>
  <circle cx="120" cy="130" r="8" fill="#F8F8FA" />
  <text class="dial-readout" x="120" y="100" text-anchor="middle" opacity="0">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.6;1" dur="1.4s" begin="indefinite" fill="freeze" id="dialTextIn" />
    <tspan id="dialPct">3%</tspan>
  </text>
  <text class="dial-label" x="120" y="150" text-anchor="middle">KLIKRATE</text>
</svg>
