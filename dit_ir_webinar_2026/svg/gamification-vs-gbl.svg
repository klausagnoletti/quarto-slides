<!-- Two-panel contrast for the GBL vs gamification slide. Left (muted): gamification props,
     trophy + medal + cake slice with candle. Right (Mikado-lit): a table seen from above with
     four seats, two cards and a d20. Geometric primitives only. -->
<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gamification props versus a game table">
  <!-- LEFT PANEL: gamification -->
  <g stroke="#CCCCCC" stroke-width="2.5" fill="none" opacity="0.45" stroke-linejoin="round" stroke-linecap="round">
    <!-- trophy -->
    <path d="M60,60 h60 v30 a30,30 0 0 1 -60,0 z" />
    <path d="M60,68 h-14 a14,14 0 0 0 14,20" />
    <path d="M120,68 h14 a14,14 0 0 1 -14,20" />
    <path d="M90,120 v18" />
    <rect x="70" y="138" width="40" height="10" />
    <!-- medal: ribbon + disc + star -->
    <path d="M178,40 l12,34 12,-34" />
    <circle cx="190" cy="92" r="24" />
    <path d="M190,76 l5,10 11,2 -8,8 2,11 -10,-5 -10,5 2,-11 -8,-8 11,-2 z" />
    <!-- cake slice: wedge with layer line and a candle -->
    <path d="M250,150 L310,150 L310,100 Z" />
    <path d="M278,150 L310,124" />
    <path d="M304,100 v-22 M304,72 q-6,-8 0,-14 q6,6 0,14" />
  </g>

  <!-- divider -->
  <line x1="340" y1="30" x2="340" y2="190" stroke="#CCCCCC" stroke-width="1.5" opacity="0.25" stroke-dasharray="4 6" />

  <!-- RIGHT PANEL: the game table -->
  <ellipse cx="490" cy="112" rx="100" ry="58" fill="none" stroke="#F8F8FA" stroke-width="3" />
  <!-- four seats -->
  <g fill="none" stroke="#FFC800" stroke-width="2.5">
    <circle cx="490" cy="42" r="11" />
    <circle cx="490" cy="182" r="11" />
    <circle cx="378" cy="112" r="11" />
    <circle cx="602" cy="112" r="11" />
  </g>
  <!-- two cards, flat -->
  <g stroke="#CCCCCC" stroke-width="2" fill="none">
    <rect x="420" y="90" width="28" height="40" rx="3" />
    <rect x="454" y="94" width="28" height="40" rx="3" />
  </g>
  <!-- d20: hexagon outline with the three inner edges -->
  <g stroke="#FFC800" stroke-width="2.5" fill="none" stroke-linejoin="round">
    <polygon points="530,86 552,99 552,125 530,138 508,125 508,99" />
    <path d="M530,86 L530,112 L552,125 M530,112 L508,125" opacity="0.7" />
  </g>
</svg>
