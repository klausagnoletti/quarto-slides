<!-- inline-css-ok: deck-local, one-off compositions for this exact deck
     (hero-line drop-shadow, presumption-card layout, seat-diagram dots,
     dial readout, countdown trigger). The one genuinely reusable rule
     (--fg-cols) already lives in the shared relationsec/theme-dark.scss,
     not here. Loaded via include-in-header so it never sits in the qmd
     body before the first ## (that creates a blank leading slide). -->
<style>
/* Bookend slow gradient drift for the title + Q&A holding slides. */
.reveal .slides section.bg-drift {
  background: linear-gradient(120deg, #111B2A, #0d1522, #111B2A);
  background-size: 400% 400%;
  animation: bgdrift 20s ease infinite;
}
@keyframes bgdrift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* Cover slide: title lockup centered in the frame, byline pinned to the
   bottom edge. Same min-height flex trick as the foundation's .vcenter. */
.reveal .slides section.cover {
  display: flex !important;
  flex-direction: column;
  min-height: 100%;
  box-sizing: border-box;
}
/* two auto margins split the free space equally: the lockup lands
   centered between the top edge and the byline */
.reveal section.cover > h2:first-child { margin-top: auto !important; }
.reveal section.cover .byline {
  margin-top: auto;
  padding-bottom: 0.6em;
  color: var(--muted);
  font-size: 0.62em;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* Large centered statement line for slides with a dimmed hero photo behind
   them (cold open, dead-document). Drop shadow keeps it legible over the
   image at any brightness. */
.hero-line {
  font-family: "Bebas Neue", sans-serif;
  font-size: 1.9em;
  letter-spacing: 0.02em;
  color: var(--ink);
  text-shadow: 0 2px 18px rgba(0,0,0,.85), 0 0 2px rgba(0,0,0,.6);
  text-align: center;
  max-width: 720px;
  margin: 0 auto;
}

/* Small muted caption under a poll/feature-grid (chat-vote instructions,
   sub-lines). */
.chip-note {
  color: var(--muted);
  font-size: 0.6em;
  letter-spacing: 0.04em;
  text-align: center;
  margin-top: 0.8em;
}

/* Gentle infinite pulse for interaction prompts (chat asks, live prompts). */
@keyframes gentlepulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.55; }
}
.pulse-cue { animation: gentlepulse 2.4s ease-in-out infinite; }

/* Full-bleed photo slide (bio/cats): fill the section, no letterboxing. */
.photo-fill {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover;
}

/* Presumption Deck: three real card images, staggered fragment entry,
   rotated/overlapped exactly like cards laid on a table. */
.presumption-cards {
  position: relative;
  height: 380px;
  max-width: 620px;
  margin: 1.2em auto 0;
}
.presumption-cards img {
  position: absolute;
  width: 220px;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  top: 40px;
}
.presumption-cards img:nth-child(1) { left: 40px;  transform: rotate(-6deg); }
.presumption-cards img:nth-child(2) { left: 200px; transform: rotate(2deg); top: 20px; }
.presumption-cards img:nth-child(3) { left: 360px; transform: rotate(-2deg); }

/* Table-seats diagram (slide 15): 5 highlight dots positioned over the base
   SVG's ghost seat coordinates (viewBox 300x220, scaled to the rendered
   width below), each a plain reveal .fragment so they light up one per
   spoken role with no custom JS. */
.seat-diagram { position: relative; width: 660px; margin: 0.6em auto; }
.seat-diagram img { display: block; width: 100%; }
.seat-diagram .seat-dot {
  position: absolute;
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 14px rgba(255,200,0,.6);
  transform: translate(-50%, -50%);
}
/* percentages of the 440x240 viewBox, so the diagram can be resized freely */
.seat-diagram .seat-dot.s1 { left: 50.0%; top: 18.75%; } /* Detective */
.seat-diagram .seat-dot.s2 { left: 70.7%; top: 35.4%; }  /* Protector */
.seat-diagram .seat-dot.s3 { left: 70.7%; top: 64.6%; }  /* Tracker */
.seat-diagram .seat-dot.s4 { left: 50.0%; top: 81.25%; } /* Communicator */
.seat-diagram .seat-dot.s5 { left: 29.3%; top: 64.6%; }  /* Crisis Manager */
.seat-diagram .seat-dot.s6 { left: 29.3%; top: 35.4%; }  /* Threat Hunter */

/* Two-state dial readout (slide 7): static needle art swapped via fragment
   visibility, no SMIL/animation-timeline risk for a live talk. */
.dial-wrap { position: relative; width: 200px; margin: 0.4em auto; }
.dial-wrap img { display: block; width: 100%; }
.dial-readout {
  position: absolute; left: 0; right: 0; top: 58%;
  text-align: center; font-family: "Bebas Neue", sans-serif;
  font-size: 1.6em; color: var(--accent);
}
</style>
