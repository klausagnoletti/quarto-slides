<!-- inline-css-ok: deck-local, one-off compositions for this exact deck
     (hero-line drop-shadow, presumption-card layout, seat-diagram dots,
     dial readout, countdown trigger). The one genuinely reusable rule
     (--fg-cols) already lives in the shared relationsec/theme-dark.scss,
     not here. Loaded via include-in-header so it never sits in the qmd
     body before the first ## (that creates a blank leading slide). -->
<style>
/* Bookend slow gradient drift for the title + Q&A holding slides. */
.reveal .slides section.bg-drift {
  /* translucent so a background-image on the same slide still shows through */
  background: linear-gradient(120deg, rgba(17,27,42,.55), rgba(13,21,34,.75), rgba(17,27,42,.55));
  background-size: 400% 400%;
  animation: bgdrift 20s ease infinite;
}
@keyframes bgdrift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* Cover slide: title lockup centered in the frame, byline pinned to the
   bottom edge. Same min-height flex trick as the foundation's .vcenter. */
.reveal .slides section.cover {
  display: flex !important;
  flex-direction: column;
  min-height: 100%;
  box-sizing: border-box;
}
/* two auto margins split the free space equally: the lockup lands
   centered between the top edge and the byline */
.reveal section.cover > h2:first-child { margin-top: auto !important; }
.reveal section.cover .byline {
  margin-top: auto;
  padding-bottom: 0.6em;
  color: var(--muted);
  font-size: 0.62em;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* ---- Illustration system (panel 08-09-2026) ----
   Vector rule: 3px+ strokes, ink primary, one Mikado accent, marks fill
   their box, always anchored. Motion rule: one-shot settle when the slide
   becomes .present, never a perpetual loop behind spoken text. Inline SVGs
   (via {{< include illus/*.qmd >}}) so page fonts and .present cues apply. */
.illus { width: 100%; margin: 0.6em auto 0; }
.illus svg { display: block; width: 100%; height: auto; }
.illus.w-sm { max-width: 320px; }
.illus.w-md { max-width: 640px; }
.illus.w-lg { max-width: 860px; }
.illus.w-xl { max-width: 900px; }
.illus text { font-family: "Source Sans 3", sans-serif; }
.illus .disp { font-family: "Bebas Neue", sans-serif; }
.illus .ink { stroke: #F8F8FA; }
.illus .acc { stroke: #FFC800; }
.illus .mut { stroke: #CCCCCC; opacity: .55; }
.illus .fill-acc { fill: #FFC800; }
.illus .fill-ink { fill: #F8F8FA; }
.illus .fill-surf { fill: #16243A; }
.illus .fill-surf2 { fill: #1C2B42; }
.illus :is(path, polygon, polyline, line, circle, rect, ellipse) { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.illus .fill-acc { fill: #FFC800; } .illus .fill-ink { fill: #F8F8FA; }
.illus .fill-surf { fill: #16243A; } .illus .fill-surf2 { fill: #1C2B42; }
.illus .hair { stroke-width: 2.5; }
.illus .thick { stroke-width: 6; }

/* one-shot motion, keyed to reveal's .present */
@keyframes settle { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@keyframes drawline { to { stroke-dashoffset: 0; } }
@keyframes rock { 0% { transform: rotate(-14deg) scale(.86); opacity: 0; } 60% { transform: rotate(5deg) scale(1.03); opacity: 1; } 100% { transform: none; opacity: 1; } }
@keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes stamp { 0% { transform: scale(2.2) rotate(-12deg); opacity: 0; } 70% { transform: scale(.95) rotate(-12deg); opacity: 1; } 100% { transform: scale(1) rotate(-12deg); opacity: 1; } }
@keyframes spark { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
@keyframes sand { from { transform: scaleY(1); } to { transform: scaleY(.15); } }
@keyframes sandup { from { transform: scaleY(.1); } to { transform: scaleY(1); } }
.reveal section .settle, .reveal section .draw, .reveal section .rock,
.reveal section .grow, .reveal section .stamp { opacity: 0; }
.reveal section.present .settle { animation: settle 700ms cubic-bezier(.22,.61,.36,1) both; }
.reveal section.present .settle.d2 { animation-delay: 180ms; }
.reveal section.present .settle.d3 { animation-delay: 360ms; }
.reveal section.present .settle.d4 { animation-delay: 540ms; }
.reveal section.present .draw { opacity: 1; stroke-dasharray: 1600; stroke-dashoffset: 1600; animation: drawline 1100ms cubic-bezier(.22,.61,.36,1) forwards; }
.reveal section.present .rock { animation: rock 900ms cubic-bezier(.22,.61,.36,1) both; transform-origin: center; transform-box: fill-box; }
.reveal section.present .grow { opacity: 1; transform-origin: bottom; transform-box: fill-box; animation: grow 800ms cubic-bezier(.22,.61,.36,1) both; }
.reveal section.present .grow.d2 { animation-delay: 150ms; }
.reveal section.present .grow.d3 { animation-delay: 300ms; }
.reveal section.present .grow.d4 { animation-delay: 450ms; }
.reveal section.present .stamp { animation: stamp 700ms cubic-bezier(.22,.61,.36,1) 500ms both; transform-origin: center; transform-box: fill-box; }
.reveal section.present .spark { animation: spark 2.6s ease-in-out infinite; }
.reveal section.present .sand-top { transform-origin: bottom; transform-box: fill-box; animation: sand 6s linear 400ms forwards; }
.reveal section.present .sand-bot { transform-origin: bottom; transform-box: fill-box; animation: sandup 6s linear 400ms forwards; }
@media (prefers-reduced-motion: reduce) {
  .reveal section .settle, .reveal section .draw, .reveal section .rock,
  .reveal section .grow, .reveal section .stamp { opacity: 1; animation: none !important; stroke-dashoffset: 0; transform: none; }
}

/* Divider slides: a faint Mikado dot lattice so the single word still sits
   on an image, without anything competing with it. */
.reveal .slides section.lattice {
  background-image: radial-gradient(circle, rgba(255,200,0,.16) 1.6px, transparent 2px);
  background-size: 34px 34px;
  background-position: center;
}

.browser { width: 900px; margin: 0.4em auto 0; border-radius: 10px; overflow: hidden;

  font-family: "Source Sans 3", sans-serif; font-size: 13px; line-height: 22px; text-align: center; margin-left: 10px; }
.browser__body { position: relative; width: 900px; height: 470px; background: #fff url("images/mm-site-fallback.png") top center / 100% auto no-repeat; }
/* transparent so the fallback screenshot shows until the live page paints */

/* Wooclap join block (slides 5, 28) and live result frame (the slides after). */

.join img { width: 220px; height: 220px; border-radius: var(--radius); box-shadow: var(--shadow); background: #fff; padding: 10px; box-sizing: border-box; }

.poll-frame { width: 960px; height: 560px; margin: 0 auto; border-radius: 10px; overflow: hidden;
  box-shadow: 0 24px 60px rgba(0,0,0,.55); border: 1px solid #2A3A55; background: #fff; }
.poll-frame iframe { width: 100%; height: 100%; border: 0; background: #fff; }

.seat-table .seat.lit .chair, .seat-table .seat.visible .chair { stroke: #FFC800; fill: rgba(255,200,0,.12); }
.seat-table .seat.lit .icon, .seat-table .seat.visible .icon { stroke: #FFC800; }
.seat-table .seat.lit .lbl, .seat-table .seat.visible .lbl { fill: #F8F8FA; }
.seat-table .seat.fragment { opacity: 1 !important; visibility: visible !important; }

/* Large centered statement line for slides with a dimmed hero photo behind
